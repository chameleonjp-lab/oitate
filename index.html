<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08141a" />
    <meta name="description" content="立ち位置と合図で、性質の異なる動物の群れを囲いへ導く3Dアクションパズル。" />
    <title>OITATE｜動物誘導アクションパズル</title>
    <style>
      #boot-status{position:fixed;z-index:10000;inset:0;display:grid;place-items:center;background:#081719;color:#f7f5e9;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;text-align:center;padding:24px}
      #boot-status[hidden]{display:none}
      #boot-status .boot-card{width:min(100%,34rem);padding:28px 24px;border:1px solid rgba(183,215,207,.28);border-radius:20px;background:rgba(8,23,25,.94);box-shadow:0 18px 60px rgba(0,0,0,.28)}
      #boot-status .boot-noscript{display:none}
      #boot-status p{margin:0;line-height:1.7}#boot-status small{display:block;margin-top:8px;color:#b7d7cf}
      #boot-status button{margin-top:20px;border:0;border-radius:999px;padding:12px 20px;background:#f7d875;color:#152322;font:inherit;font-weight:700;cursor:pointer}
      #boot-status button:focus-visible{outline:3px solid #fff;outline-offset:3px}
    </style>
    <script>
      (function () {
        var pending = null;
        function isWebGLFailure(reason) {
          var text = reason && reason.message ? reason.message : String(reason || "");
          return /webgl|renderer|3d|context/i.test(text);
        }
        function showFailure(reason) {
          var boot = document.getElementById("boot-status");
          var app = document.getElementById("app");
          if (!boot) {
            pending = reason;
            return;
          }
          if (app) {
            app.replaceChildren();
            app.inert = true;
            app.setAttribute("aria-hidden", "true");
          }
          var webgl = isWebGLFailure(reason);
          boot.hidden = false;
          boot.dataset.bootFailure = webgl ? "webgl" : "general";
          boot.setAttribute("role", "alert");
          boot.innerHTML = '<div class="boot-card"><p>'
            + (webgl ? "3D画面を開始できませんでした。" : "ゲームの読み込みに失敗しました。")
            + '<small>'
            + (webgl ? "WebGLを利用できない可能性があります。" : "ゲームの初期化に失敗しました。")
            + '</small></p><button type="button" data-boot-retry>もう一度読み込む</button></div>';
          var retry = boot.querySelector("[data-boot-retry]");
          if (retry) retry.addEventListener("click", function () { window.location.reload(); });
        }
        window.__OITATE_BOOT_FALLBACK__ = showFailure;
        window.addEventListener("error", function (event) {
          var app = document.getElementById("app");
          if (app && app.dataset.ready === "true") return;
          showFailure(event.error || event.message);
        });
        window.addEventListener("unhandledrejection", function (event) {
          var app = document.getElementById("app");
          if (app && app.dataset.ready === "true") return;
          showFailure(event.reason);
        });
        document.addEventListener("DOMContentLoaded", function () {
          if (pending) showFailure(pending);
        });
      }());
    </script>
    <link rel="stylesheet" href="/src/portrait.css" />
  </head>
  <body>
    <div id="boot-status" class="boot-status" data-boot-status role="status" aria-live="polite">
      <div class="boot-card boot-loading"><p>OITATEを読み込んでいます…</p></div>
      <div class="boot-card boot-noscript" role="alert"><p>JavaScriptを有効にしてください。</p></div>
    </div>
    <div id="app" aria-label="OITATE 動物誘導アクションパズル" inert aria-busy="true"></div>
    <noscript><style>#boot-status .boot-loading{display:none!important}#boot-status .boot-noscript{display:block}</style></noscript>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
